- aid: ab180:airbridge-mcp
  name: Airbridge MCP Server
  description: 'Airbridge''s hosted Model Context Protocol server. Streamable HTTP transport
    at https://mcp.airbridge.io/mcp, protected by OAuth 2.1 with PKCE (S256) and dynamic
    client registration; it lets an MCP-compatible agent query Airbridge attribution and
    campaign performance data in natural language. PII access is blocked by the provider.'
  humanURL: https://www.airbridge.io/en/product/airbridge-ai
  baseURL: https://mcp.airbridge.io/mcp
  image: https://www.airbridge.io/og-image-home.png
  tags:
