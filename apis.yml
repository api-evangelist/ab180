apis:
- aid: ab180:airbridge-api
  name: Airbridge API
  description: 'The Airbridge REST API. Resource-oriented URLs over HTTPS, JSON responses,
    bearer API-token authentication and RFC 9457 problem+json errors. Covers tracking links
    (create, read, list, update Open Graph and routing), server-to-server in-app and in-web
    event ingestion, asynchronous report queries (Actuals, Revenue, Active Users, Retention)
    with their metadata endpoints, raw data export requests, attribution result lookup,
    self-serve ad-spend and metric data upload, and the SKAdNetwork conversion value schema.'
  humanURL: https://help.airbridge.io/en/references/introduction
  baseURL: https://api.airbridge.io
  image: https://www.airbridge.io/og-image-home.png
  tags:
  - Attribution
  - Tracking Links
  - Events
  - Reporting
  - Raw Data
