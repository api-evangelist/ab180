aid: ab180
name: Ab180
description: 'AB180 Inc. is a Seoul, South Korea based marketing technology company and
  the maker of Airbridge, a mobile measurement partner (MMP) and people-based attribution
  platform that measures paid and organic acquisition across mobile apps, web, PC, console
  and CTV in one dashboard. Airbridge exposes a public REST API at api.airbridge.io covering
  tracking-link creation and management, server-to-server in-app and in-web event ingestion,
  asynchronous Actuals / Revenue / Active Users / Retention report queries, raw data export,
  attribution result lookup, self-serve ad-spend and metric upload, and SKAdNetwork conversion-value
  schema retrieval, alongside eleven first-party SDKs and a hosted, OAuth 2.1 protected Model
  Context Protocol server at mcp.airbridge.io for agent access to attribution data.'
