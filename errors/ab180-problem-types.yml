method: searched
format: rfc9457
source: 'Airbridge API reference response examples at help.airbridge.io/en/references/*,
  plus a live probe of https://api.airbridge.io/openapi.json which returned an RFC 9457
  document with Content-Type application/problem+json (HTTP 404, fetched 2026-09-05).'
envelope:
  media_type: application/problem+json
  observed_live: true
  observed_at: https://api.airbridge.io/openapi.json
  fields:
  - name: type
    description: 'Problem type URI. Airbridge emits the literal "about:blank" on every
      documented example — no dereferenceable per-problem type URIs are published.'
  - name: title
    description: 'Short label. Inconsistent register across services: some responses use
      an HTTP reason phrase ("Not Found", "Bad Request"), some a SCREAMING_SNAKE code
      ("UNAUTHORIZED", "NOT_FOUND"), and some a lower_snake domain code
      ("url_disabled_by_toggle", "invalid_request").'
  - name: detail
    description: Human-readable explanation of this occurrence.
  - name: status
    description: HTTP status code, repeated in the body.
  - name: instance
    description: 'Present but null in every published example.'
  - name: traceId
    description: 'RFC 9457 extension member. AWS X-Ray style trace identifier
      (1-<hex>-<hex>) an operator can quote to Airbridge support.'
  - name: errors
    description: 'RFC 9457 extension member, validation failures only. Array of
      {loc: [field], msg, type} entries.'
legacy_envelope:
  note: 'The Attribution Result API does NOT use problem+json. It returns a bare
    {"result": "<message>"} object on both 400 and 401, an older envelope that predates
    the problem-details rollout.'
  source: https://help.airbridge.io/en/references/attribution-result/get-attribution-result
  fields:
  - name: result
    description: Plain-text error message.
